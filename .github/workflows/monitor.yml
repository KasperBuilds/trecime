name: Auronzo Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Camofox-Browser Server
        working-directory: ./camofox-browser
        run: npm install

      - name: Inject Camoufox Profile
        run: |
          mkdir -p ~/.camofox/profiles/585dd6332347ac93c97e0e379a14f8c0
          echo '${{ secrets.CAMOFOX_STORAGE_STATE }}' > ~/.camofox/profiles/585dd6332347ac93c97e0e379a14f8c0/storage-state.json

      - name: Start Camofox-Browser Server
        working-directory: ./camofox-browser
        run: |
          unset CAMOUFOX_EXECUTABLE
          npm start &
          sleep 10

      - name: Run Monitor Sweep
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 auronzo_monitor.py --once

      - name: Commit state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add auronzo_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state" && git push)
