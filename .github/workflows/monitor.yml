name: Auronzo Monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: auronzo-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: camofox-browser/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Camofox-Browser Server
        working-directory: ./camofox-browser
        run: npm ci

      - name: Inject Camoufox Profile
        run: |
          mkdir -p ~/.camofox/profiles/585dd6332347ac93c97e0e379a14f8c0
          echo '${{ secrets.CAMOFOX_STORAGE_STATE }}' > ~/.camofox/profiles/585dd6332347ac93c97e0e379a14f8c0/storage-state.json

      - name: Start Camofox-Browser Server
        working-directory: ./camofox-browser
        run: |
          unset CAMOUFOX_EXECUTABLE
          npm start &
          sleep 10

      - name: Run Monitor Sweep
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 auronzo_monitor.py --once

      - name: Commit state
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add auronzo_state.json
          git diff --cached --quiet || (git commit -m "Update state" && git push)
